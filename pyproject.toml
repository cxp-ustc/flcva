[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flcva-research"
version = "0.1.0"
description = "Full-Ledger Counterfactual Value Audit for adaptive language-model reasoning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "antlr4-python3-runtime>=4.11,<4.12",
  "datasets>=3.0,<5",
  "huggingface-hub>=0.34,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "sympy>=1.13,<2",
  "transformers>=4.55,<5",
]

[project.optional-dependencies]
gpu = ["vllm>=0.11,<0.12"]
dev = ["matplotlib>=3.9,<4", "pytest>=8.3,<10"]

[project.scripts]
flcva = "flcva.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
